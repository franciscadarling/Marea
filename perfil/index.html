<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil</title>
    <link rel="stylesheet" href="perfil.css">
    <script src="perfil.js" defer></script>
</head>
<body>
    <div class="app">
        <header class="header">
            <div class="foto-logo">
                <img class="imglogo" src="../Logo.png" alt="Logo">
            </div>
            <a href="../perfil/index.html" class="fotoPerfil">
                <img class="imglogo"  id="fotito" src="../editar.foto.png" alt="pfp">
            </a>
        </header>
    
        <main class="pantalla">

    <div class="foto-perfil-grande">
        <img id="fotoPerfil" class="imagenperfil" src="Group 2.png" alt="Foto de perfil">
        
        <input type="file" id="inputFoto" accept="image/*" class="inputFoto">
    </div>
            <section class="info">
                <h1>Datos personales</h1>
                <div class="dato-fila">
                    <p id="usuario">Usuario:</p>
                    <button class="punto-editar" id="usuario-editar"><img src="group 7.png" alt="Editar"></button>
                </div>

                <dialog id="inputUsuario">
                <h2>Cambia tu nombre de usuario</h2>
                <input type="text" id="nuevoUsuario" placeholder="Nuevo nombre de usuario">
                <button id="cerrar-usuario">Guardar</button>
                </dialog>

                <div class="dato-fila">
                    <p id="mail">Correo:</p>
                    <button class="punto-editar" id="mail-editar"><img src="group 7.png" alt="Editar"></button>
                </div>

                <dialog id="inputMail">
                <h2>Cambia tu correo electrónico</h2>
                <input type="email" id="nuevoMail" placeholder="Nuevo correo electrónico">
                <button id="cerrar-mail">Guardar</button>
                </dialog>

                <div class="dato-fila">
                    <p id="contrasena">Contraseña:</p>
                    <button class="punto-editar" id="contrasena-editar"><img src="group 7.png" alt="Editar"></button>
                </div>

                <dialog id="inputContrasena">
                <h2>Cambia tu contraseña</h2>
                <input type="password" id="nuevaContrasena" placeholder="Nueva contraseña">
                <button id="cerrar-contrasena">Guardar</button>
                </dialog>

                </section>

            <section class="info">
                <h1>Sobre tu ciclo</h1>
                <div class="dato-fila">
                    <p id="duracionCiclo">Duración ciclo:</p>
                    <button class="punto-editar" id="duracionCiclo-editar"><img src="group 7.png" alt="Editar"></button>
                </div>

                <dialog id="inputduracionCiclo">
                <h2>Cambia la duración del ciclo</h2>
                <input type="number" id="nuevaDuracionCiclo" placeholder="Nueva duración del ciclo">
                <button id="cerrar-duracionCiclo">Guardar</button>
                </dialog>

                <div class="dato-fila">
                    <p id="duracionMenstruacion">Duración de la menstruación:</p>
                    <button class="punto-editar" id="duracionMenstruacion-editar"><img src="group 7.png" alt="Editar"></button>
                </div>

                <dialog id="inputduracionMenstruacion">
                <h2>Cambia la duración de la menstruación</h2>
                <input type="number" id="nuevaDuracionMenstruacion" placeholder="Nueva duración de la menstruación">
                <button id="cerrar-menstruacion">Guardar</button>
                </dialog>

            </section>
            <button class="cerrar-sesion" id="cerrar-sesion">CERRAR SESIÓN</button>
        </main>
    
        <nav class="botones">
            <a href="../index.html" class="botonpagina"><img src="../imagenes-botones/Home.png" alt="home"></a> 
            <a href="../chatbot/index.html" class="botonpagina"><img src="../imagenes-botones/Chatbot.png" alt="chatbot"></a>
            <a href="../registro/index.html" class="botonpagina"><img src="../imagenes-botones/Registro.png" alt="registro"></a>
            <a href="../calendario/index.html" class="botonpagina"><img src="../imagenes-botones/Calendario.png" alt="calendario"></a>
            <a href="../educacion/index.html" class="botonpagina"><img src="../imagenes-botones/Educacion.png" alt="educacion"></a>
        </nav>
     </div>
</body>
</html>
