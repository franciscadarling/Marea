<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artículo</title>
    <link rel="stylesheet" href="contenedor.css">
    
    <!-- Fuentes Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
  <script src="contenedor.js"></script>
</head>
<body>
  <div class="app">
    <!-- Header Superior -->
    <header class="header">
      <div class="foto-logo">
        <img class="imglogo" src="../Logo.png" alt="Logo">
      </div>
      <a href="../perfil/index.html" class="fotoPerfil">
        <img class="imglogo" src="../Logo.png" alt="Perfil">
      </a>
    </header>

    <!-- Contenido de la Pantalla -->
    <main class="pantalla">
      <h1 id="titulo" class="titulo-articulo">Título del artículo</h1>
      <h2 id="subtitulo" class="subtitulo-articulo">Subtítulo</h2>
      
      <div class="contenedor-texto">
        <p id="cuerpo" class="cuerpo-articulo">Texto del artículo...</p>
      </div>

      <!-- Control de 'Marcar como leído' (Sección inferior) -->
      <div class="marcar-leido-container">
        <span class="texto-marcar-leido">Marcar como leído</span>
        <input type="checkbox" id="check-leido" class="checkbox-leido">
      </div>
    </main>

    <!-- Barra de Navegación Inferior -->
    <nav class="botones">
      <a href="../index.html" class="botonpagina"><img src="../imagenes-botones/Home.png" alt="home"></a> 
      <a href="../chatbot/index.html" class="botonpagina"><img src="../imagenes-botones/Chatbot.png" alt="chatbot"></a>
      <a href="../registro/index.html" class="botonpagina"><img src="../imagenes-botones/Registro.png" alt="registro"></a>
      <a href="../calendario/index.html" class="botonpagina"><img src="../imagenes-botones/Calendario.png" alt="calendario"></a>
      <a href="../educacion/index.html" class="botonpagina"><img src="../imagenes-botones/Educacion.png" alt="educacion"></a>
    </nav>
  </div>
</body>
</html>
