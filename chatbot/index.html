<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot</title>
    <!-- Fuentes Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="chatbot.css">
    <script src="../foto-perfil.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body class="pagina-chatbot">
<div class="app">
    <header class="header">
        <div class="foto-logo">
            <img class="imglogo" src="../Logo.png" alt="Logo">
        </div>
        <a href="../perfil/index.html" class="fotoPerfil">
            <img id="fotito" class="imglogo" src="../editar.foto.png" alt="Logo">
        </a>
    </header>

    <section class="pantalla">
        <div class="chat" id="chat">
            <div class="chat-interior">
                <div class="mensaje"> 
                    <div class="avatar"><img src="./Avatar-Selene/Property 1=Dormida.png" alt="Avatar-Selene"> </div>
                       <article class="bdetexto" id="burbujaAvatar">Hola, soy Selene. ¿En qué te puedo ayudar?</article>
                </div>
                <div class="respuesta" id="historial" style="display: none;">
                </div>
            </div>
        </div>


        
        <form class="preguntar" id="formMensaje">
            <button type="button" id="eliminar" class="eliminar">Eliminar historial</button>
            <div class="caja-pregunta">
                <textarea placeholder="Pregúntale a Selene..." class="inputpregunta" id="mensaje" rows="2"></textarea>
                <button type="submit" id="Enviar" class="enviar" aria-label="Enviar">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M4 12h15"></path>
                        <path d="M13 5l7 7-7 7"></path>
                    </svg>
                </button>
            </div>
        </form>
    </section>

    <nav class="botones">
        <a href="../index.html" class="botonpagina"><img src="../imagenes-botones/Home.png" alt="home"></a> 
        <a href="../chatbot/index.html" class="botonpagina"><img src="../imagenes-botones/Chatbot.png" alt="chatbot"></a>
        <a href="../registro/index.html" class="botonpagina"><img src="../imagenes-botones/Registro.png" alt="registro"></a>
        <a href="../calendario/index.html" class="botonpagina"><img src="../imagenes-botones/Calendario.png" alt="calendario"></a>
        <a href="../educacion/index.html" class="botonpagina"><img src="../imagenes-botones/Educacion.png" alt="educacion"></a>
    </nav>
</div>
</body>
</html>
