<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="inicio-sesion.css">
    <script src="script.js" defer></script>
</head>
<body>
   <div class="app">
   <main class="pantalla">

      <h1>Inicia sesión</h1>

      <form id="formulario-signup" class="inputpapa" novalidate>
         <div class="email">
             <h2 id="etiqueta-mail">E-mail:</h2>
             <input
                 class="input"
                 id="mail"
                 name="mail"
                 type="email"
                 autocomplete="email"
                 required
                 aria-labelledby="etiqueta-mail"
             >
         </div>
         <div class="contrasena">
             <h2 id="etiqueta-contrasena">Contraseña:</h2>
             <div class="campo-contrasena">
                 <input
                     class="input input-contrasena"
                     id="contrasena"
                     name="contrasena"
                     type="password"
                     autocomplete="new-password"
                     required
                     aria-labelledby="etiqueta-contrasena"
                 >
             </div>
         </div>
         <p id="error-signup" class="mensaje-error" role="alert" hidden></p>
         <button type="submit" class="boton">Siguiente</button>
     </form>
<a class="boton-2" href="../sign-up/sign-up.html">
<p>¿No tenés cuenta? Regístrate</p>
</a>

</div>
   </main> 
</div>
</body>
</html>
